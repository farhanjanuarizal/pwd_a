<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
    <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Form Reservasi Hotel</title>
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" />
    </head>
    <body>

<div class="container">
    <h1>Form Reservasi Hotel</h1>

    <form action="" method="post">
        <table cellspacing="4" cellpadding="4" border="1" class="form-table">

        <!-- Personal Data Section -->
        <tr>
        <td colspan="2" class="section-header">Personal Data</td>
        </tr>
        <tr>
        <td width="30%"><label for="name" class="form-label">1. Name</label></td>
        <td><input type="text" id="name" name="name" class="form-input" /></td>
        </tr>
        <tr>
        <td><strong class="form-label">2. Gender</strong></td>
        <td>
        <input type="radio" id="male" name="gender" value="male" class="radio-input" />
        <label for="male" class="radio-label">Male</label>
        <input type="radio" id="female" name="gender" value="female" class="radio-input" />
        <label for="female" class="radio-label">Female</label>
        </td>
        </tr>
        <tr>
        <td><label for="email" class="form-label">3. Email Address</label></td>
        <td><input type="text" id="email" name="email" class="form-input" /></td>
        </tr>
        <tr>
        <td><label for="telephone" class="form-label">4. Telephone Number</label></td>
        <td><input type="text" id="telephone" name="telephone" class="form-input" /></td>
        </tr>

        <!-- Reservation Room Form Section -->
        <tr>
        <td colspan="2" class="section-header">Reservation Room Form</td>
        </tr>
        <tr>
        <td><label for="reservation_name" class="form-label">1. Reservation Name</label></td>
        <td><input type="text" id="reservation_name" name="reservation_name" class="form-input" /></td>
        </tr>
        <tr>
        <td><label for="booking_date" class="form-label">2. Booking Date</label></td>
        <td><input type="text" id="booking_date" name="booking_date" class="form-input" placeholder="DD/MM/YYYY" /></td>
        </tr>
        <tr>
        <td><label for="room_type" class="form-label">3. Room Type</label></td>
        <td>
        <select id="room_type" name="room_type" class="form-select">
        <option>Standard Room</option>
        <option>Deluxe Room</option>
        <option>Suite Room</option>
        </select>
        </td>
        </tr>
        <tr>
        <td><label for="bed_type" class="form-label">4. Bed Type</label></td>
        <td>
        <select id="bed_type" name="bed_type" class="form-select">
        <option>Single Bed</option>
        <option>Double Bed</option>
        <option>Twin Beds</option>
        <option>Queen Size</option>
        <option>King Size</option>
        </select>
        </td>
        </tr>
        <tr>
        <td><strong class="form-label">5. Breakfast</strong></td>
        <td>
        <input type="radio" id="with_breakfast" name="breakfast" value="with" class="radio-input" />
        <label for="with_breakfast" class="radio-label">With Breakfast</label>
        <input type="radio" id="without_breakfast" name="breakfast" value="without" class="radio-input" />
        <label for="without_breakfast" class="radio-label">Without Breakfast</label>
        </td>
        </tr>

        <!-- Payment Section -->
        <tr>
        <td colspan="2" class="section-header">Payment</td>
        </tr>
        <tr>
        <td><label for="checkin_date" class="form-label">1. Check-in Date</label></td>
        <td><input type="text" id="checkin_date" name="checkin_date" class="form-input" placeholder="DD/MM/YYYY" /></td>
        </tr>
        <tr>
        <td><label for="checkout_date" class="form-label">2. Check-out Date</label></td>
        <td><input type="text" id="checkout_date" name="checkout_date" class="form-input" placeholder="DD/MM/YYYY" /></td>
        </tr>
        <tr>
        <td><label for="payment_method" class="form-label">3. Payment Method</label></td>
        <td>
        <select id="payment_method" name="payment_method" class="form-select">
        <option>Credit Card</option>
        <option>Debit Card</option>
        <option>Cash</option>
        <option>Bank Transfer</option>
        </select>
        </td>
        </tr>

        <!-- Submit Button -->
        <tr>
        <td colspan="2" class="submit-cell">
        <input type="submit" name="reserve" value="Submit Reservation" class="submit-button" />
        </td>
        </tr>

        </table>
    </form>
</div>

</body>
</html>
